services:
  web:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_NAME: Old School Shuffle
      NEXT_PUBLIC_TAGLINE: Playlist-led music writing, after-hours recommendations, and an editorial queue built to be explored like a stream.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
